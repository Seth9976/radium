name: Build Radium Windows Full Version

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}

    # 任务级环境变量: make packages / check_dependencies.sh / 编译步骤都能读到
    env:
      QMAKE_LIBS_ONLY_L_SHOULD_BE_EMPTY: "1"   # 本次失败的直接修复
      INCLUDE_FAUSTDEV: "0"
      INCLUDE_FAUSTDEV_BUT_NOT_LLVM: "0"
      FAUST_USES_LLVM: "0"
      INCLUDE_PDDEV: "0"
      INCLUDE_PD2DEV: "0"

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 初始化 MSYS2 与 MinGW64 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            base-devel git dos2unix patch tar unzip curl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-shadertools
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-dlfcn

      # 关键修复: 补丁前把源码与 .diff 统一为 LF,消除 "different line endings";
      # 补丁失败不再吞掉,直接报错终止(它们是 MinGW 编译必需的修复)
      - name: 探测并应用 JUCE 与 MinGW 专用补丁
        run: |
          set -eo pipefail
          echo "== 统一行尾为 LF =="
          find pluginhost -type f $$ -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.c' -o -name '*.diff' $$ \
            -exec dos2unix {} + >/dev/null 2>&1 || true

          FAILED=""
          for p in \
            pluginhost/mingw_compilation_fix2.diff \
            pluginhost/mingw_compilation_fix_native_message_box.diff \
            pluginhost/mingw_compilation_fix_timer.diff \
            pluginhost/radium_midi_message_rt_alloc.diff \
            pluginhost/vst_dont_effopen_in_findAllTypesForFile_juce_issue_811.diff
          do
            [ -f "$p" ] || { echo "跳过(文件不存在): $p"; continue; }
            dos2unix "$p" >/dev/null 2>&1 || true
            if out=$(patch -p1 -N -i "$p" 2>&1); then
              echo "$out"; echo "OK 已应用: $p"
            else
              echo "$out"
              if echo "$out" | grep -qi 'Skipping patch'; then
                echo "OK 已包含(可能已被上游合并): $p"
              else
                echo "::error::补丁未能应用: $p"
                FAILED="$FAILED $p"
              fi
            fi
          done
          find pluginhost -name '*.rej' -delete >/dev/null 2>&1 || true
          if [ -n "$FAILED" ]; then echo "::error::补丁失败:${FAILED}"; exit 1; fi

      # VST2 SDK: 你已把 pluginterfaces/vst2.x 与 public.sdk/source/vst2.x 放在仓库根目录
      # -I$(pwd) 让 #include <pluginterfaces/vst2.x/aeffect.h> 可解析(编译步骤已加)
      # 同时构造 VST2_SDK 布局,兼容构建系统按 SDK 目录结构查找
      - name: 配置 VST SDK 头文件布局
        run: |
          set -eo pipefail
          test -f pluginterfaces/vst2.x/aeffect.h
          test -f pluginterfaces/vst2.x/aeffectx.h
          VSTSDK="$(pwd)/.vsdk"
          mkdir -p "$VSTSDK/VST2_SDK" "$VSTSDK/VST3_SDK"
          cp -a pluginterfaces "$VSTSDK/VST2_SDK/"
          cp -a public.sdk "$VSTSDK/VST2_SDK/"
          echo "VSTSDK=$VSTSDK" >> "$GITHUB_ENV"
          echo "== VST 文件清单 =="
          ls pluginterfaces/vst2.x/ public.sdk/source/vst2.x/

      - name: 缓存捆绑依赖构建产物
        uses: actions/cache@v4
        with:
          path: |
            bin/packages/python27_install
            bin/packages/gc-8.2.8
            bin/packages/QScintilla_src-2.14.0
            bin/packages/fluidsynth-1.1.6
            bin/packages/libgig
          key: radium-deps-mingw64-${{ hashFiles('bin/packages/build.sh', 'bin/packages/build_python27.sh', 'Makefile.Qt') }}

      - name: 构建捆绑依赖 (make packages)
        run: |
          set -eo pipefail
          echo "QMAKE_LIBS_ONLY_L_SHOULD_BE_EMPTY=${QMAKE_LIBS_ONLY_L_SHOULD_BE_EMPTY:-未设置!}"
          export MY_CC=gcc
          export MY_CPP=g++
          make packages
          echo "== 环境自检 =="
          gcc --version | head -n1
          (qmake-qt6 -v || qmake -v) 2>/dev/null || true
          pkg-config --libs-only-L Qt6Core || true
          echo "(以上输出为空属正常,已由 QMAKE_LIBS_ONLY_L_SHOULD_BE_EMPTY=1 豁免)"
          PY=$(./find_python_path.sh) && "$PY" -V
          ls -la bin/packages/python27_install/bin

      - name: 编译 Radium (FULL_VERSION=1)
        run: |
          set -eo pipefail
          export FULL_VERSION=1
          export BUILDTYPE=RELEASE
          export TARGET_OS=windows
          export RADIUM_USE_CLANG=0
          export INCLUDE_FAUSTDEV=0
          export INCLUDE_FAUSTDEV_BUT_NOT_LLVM=0
          export FAUST_USES_LLVM=0
          export INCLUDE_PDDEV=0
          export INCLUDE_PD2DEV=0
          export QMAKE_LIBS_ONLY_L_SHOULD_BE_EMPTY=1
          export QMAKE=$(command -v qmake-qt6 || command -v qmake)
          export MOC=$(command -v moc-qt6 || command -v moc)
          export UIC=$(command -v uic-qt6 || command -v uic)
          export QSB=$(command -v qsb-qt6 || command -v qsb)
          [ -n "$QMAKE" ] && [ -n "$MOC" ] && [ -n "$UIC" ] && [ -n "$QSB" ] \
            || { echo "::error::Qt 工具探测失败: QMAKE=$QMAKE MOC=$MOC UIC=$UIC QSB=$QSB"; exit 1; }
          export PKGqt="pkg-config"
          export PYTHONEXE="$(./find_python_path.sh)"
          echo "PYTHONEXE=$PYTHONEXE"; "$PYTHONEXE" -V
          export OBJ_X11=""
          export OBJ_MACOSX=""
          export RADIUM_TMP_BIN_DIR="$(pwd)/bin"
          export RADIUM_TMP_OBJ_DIR="$(pwd)/build_objects"
          export T="${RADIUM_TMP_OBJ_DIR}/"
          mkdir -p "${RADIUM_TMP_OBJ_DIR}"
          export OS_OPTS="-I$(pwd) -Werror=array-bounds -msse2 -mfpmath=sse -DFOR_WINDOWS -D__WINDOWS_MM__ -DTHREADED_OPENGL=0"
          WIN_SYS_LIBS="-lcomdlg32 -limm32 -lole32 -loleaut32 -lrpcrt4 -lshlwapi -luuid -lversion -lwininet -lwinmm -lws2_32 -lwsock32 -lgdi32 -luser32 -lkernel32 -lcomctl32 -lsetupapi -lksuser -ldxgi -ldl"
          export OS_LDFLAGS="${WIN_SYS_LIBS}"
          make api/s7_types.h buildtype.opt flagopts.opt api/radium_proc.h common/keyboard_sub_ids.h --stop
          make -j$(nproc) radium --stop
          find bin/ -maxdepth 1 -name "*.exe" -exec strip --strip-all {} \;

      - name: 收集 Windows 发布依赖库并打包
        run: |
          set -eo pipefail
          mkdir -p release_package
          cp -rf bin/* release_package/ || true
          rm -rf release_package/packages release_package/*.temp_log
          EXE=""
          for cand in release_package/radium.bin.exe release_package/radium.exe release_package/radium.bin; do
            [ -f "$cand" ] && EXE="$cand" && break
          done
          echo "目标可执行文件: ${EXE:-未找到}"
          [ -n "$EXE" ] || exit 1
          windeployqt --release --no-translations "$EXE" || echo "::warning::windeployqt 未成功,改用手动收集"
          cp -f bin/packages/python27_install/bin/*.dll release_package/ 2>/dev/null || true
          cp -f bin/packages/python27_install/lib/*.dll release_package/ 2>/dev/null || true
          find /mingw64/bin $$ \
              -name "libgcc_s_seh-1.dll" -o -name "libstdc++-6.dll" -o -name "libwinpthread-1.dll" \
              -o -name "libgomp-*.dll" -o -name "libsndfile-1.dll" -o -name "libsamplerate-0.dll" \
              -o -name "liblo-*.dll" -o -name "libglib-2.0-0.dll" -o -name "libintl-*.dll" \
              -o -name "libpcre2-8.dll" -o -name "libogg-0.dll" -o -name "libvorbis*.dll" \
              -o -name "libFLAC*.dll" -o -name "libopus-0.dll" -o -name "libmpg123-*.dll" \
              -o -name "libmp3lame-*.dll" \
            $$ -exec cp -f {} release_package/ \;

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Radium-Win10-FullVersion-x64
          path: release_package/
